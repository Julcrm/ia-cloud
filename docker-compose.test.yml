# Environnement de test : tout tourne en local, ERP compris (ADR-0007).
#   docker compose -f docker-compose.test.yml up --build
# Ordre : Redpanda + topic erp.orders -> simulateur (historique + 100 commandes live publiées,
#         puis s'arrête) -> deux consumers, vers la base ERP et vers DuckLake (s'arrêtent une fois
#         le topic vidé) -> entraînement sur DuckLake -> API avec le modèle obtenu.
#         Le lac du consumer (volume erp_lake) est distinct de celui de l'API.
# Les services ERP viennent de erp-simulator/, sans modification.

# Lac local du consumer ERP, relu par l'entraînement (catalogue fichier : un seul processus à la fois).
x-lake-env: &lake-env
  DUCKLAKE_CATALOG: ducklake:/lake/catalog.ducklake
  DUCKLAKE_DATA_PATH: /lake/data/

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: postgres
    ports: !reset []

  redpanda:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: redpanda

  redpanda-init:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy

  erp-simulator:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: erp-simulator
    environment:
      INTERVAL_SECONDS: 0
      LIVE_ORDER_LIMIT: 11100
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  erp-postgres-sink:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: erp-postgres-sink
    environment:
      STOP_AFTER_IDLE_SECONDS: 15
    depends_on:
      postgres:
        condition: service_healthy
      erp-simulator:
        condition: service_completed_successfully

  # Volume du lac rendu inscriptible par l'utilisateur app (uid 1000) du consumer et de l'entraînement.
  lake-init:
    image: postgres:17-alpine
    entrypoint: ["chown", "1000:1000", "/lake"]
    volumes:
      - erp_lake:/lake

  erp-ducklake-sink:
    <<: *hardening
    build:
      context: .
      target: ingest
    environment:
      <<: *lake-env
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      STOP_AFTER_IDLE_SECONDS: 15
    volumes:
      - erp_lake:/lake
    depends_on:
      lake-init:
        condition: service_completed_successfully
      erp-simulator:
        condition: service_completed_successfully

  train:
    <<: *hardening
    build:
      context: .
      target: train
    environment:
      <<: *lake-env
      ORDERS_SOURCE: ducklake
    volumes:
      - artifacts:/app/artifacts
      - erp_lake:/lake
    depends_on:
      erp-ducklake-sink:
        condition: service_completed_successfully

  api:
    <<: *hardening
    build:
      context: .
      target: api
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:uid=1000,gid=1000
    environment:
      API_KEY: test
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts:ro
    depends_on:
      train:
        condition: service_completed_successfully

volumes:
  artifacts:
  erp_lake:
  postgres_erp_data:
