[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "express-delivery"
version = "1.0.0"
description = "Prédiction de l'éligibilité d'une commande à la livraison express."
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "duckdb>=1.5.6",
]

# mlflow ne sert qu'à l'entraînement : l'image de l'API ne l'installe pas.
[dependency-groups]
train = ["mlflow>=3.16.1"]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]
# Dagster ne sert qu'au code server du réentraînement, sur la série du dagster-workspace du VPS.
orchestration = [
    "dagster==1.13.24",
    "dagster-postgres==0.29.24",
]

[tool.uv]
default-groups = ["train", "dev", "orchestration"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb", "tp4"] # code fourni par le cours (notebook, simulateur ERP), gardé tel quel

[tool.ruff.lint]
# pycodestyle, pyflakes, ordre des imports, syntaxe moderne, bugs fréquents
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
