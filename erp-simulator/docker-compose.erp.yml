services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: livraison_express
      POSTGRES_USER: livraison
      POSTGRES_PASSWORD: livraison
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_erp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraison -d livraison_express"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Même version et même réglage que le Redpanda partagé du VPS (topics créés à la main).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
      - --set redpanda.auto_create_topics_enabled=false
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Topic des commandes : 3 partitions, rétention illimitée pour pouvoir rejouer et reconstruire une base.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rpk topic list -X brokers=redpanda:9092 | grep -q '^erp.orders '
        || rpk topic create erp.orders -p 3 -r 1 -c retention.ms=-1 -X brokers=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  # Le simulateur ne fait que publier dans le topic.
  erp-simulator:
    build:
      context: .
      dockerfile: Dockerfile.erp-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      BATCH_SIZE: ${BATCH_SIZE:-5}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HISTORY_ORDERS: ${POSTGRES_HISTORY_ORDERS:-10000}
      RECENT_HISTORY_ORDERS: ${RECENT_HISTORY_ORDERS:-1000}
      LIVE_ORDER_LIMIT: ${LIVE_ORDER_LIMIT:-0}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  # Consumer : recopie le topic dans la base de l'ERP.
  erp-postgres-sink:
    build:
      context: .
      dockerfile: Dockerfile.erp-simulator
    command: ["python", "postgres_sink.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_DSN: postgresql://livraison:livraison@postgres:5432/livraison_express
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

volumes:
  postgres_erp_data:
