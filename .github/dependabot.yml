# Mises à jour proposées en pull request vers dev, validées par le pipeline.
version: 2
updates:
  - package-ecosystem: github-actions # SHA des actions du pipeline
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker # empreinte de l'image Python de base
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: uv # dépendances Python (uv.lock)
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
