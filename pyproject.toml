[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "express-delivery"
version = "1.0.0"
description = "Prédiction de l'éligibilité d'une commande à la livraison express."
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
