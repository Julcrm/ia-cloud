# Instance Dagster du code server : même stockage PostgreSQL que le dagster-workspace du VPS,
# les runs s'exécutent ici et y écrivent leurs événements.
storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432
