# Environnement de test : tout tourne en local, ERP compris (ADR-0007).
#   docker compose -f docker-compose.test.yml up --build
# Ordre : Redpanda + topic erp.orders -> simulateur (historique + 100 commandes live publiées,
#         puis s'arrête) -> consumer vers la base ERP (s'arrête une fois le topic vidé)
#         -> entraînement sur l'ERP -> API avec le modèle obtenu.
#         En parallèle, consumer erp.orders -> DuckLake (lac local, distinct de celui de l'API).
# Les services ERP viennent de erp-simulator/, sans modification.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: postgres
    ports: !reset []

  redpanda:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: redpanda

  redpanda-init:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy

  erp-simulator:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: erp-simulator
    environment:
      INTERVAL_SECONDS: 0
      LIVE_ORDER_LIMIT: 11100
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  erp-postgres-sink:
    extends:
      file: erp-simulator/docker-compose.erp.yml
      service: erp-postgres-sink
    environment:
      STOP_AFTER_IDLE_SECONDS: 15
    depends_on:
      postgres:
        condition: service_healthy
      erp-simulator:
        condition: service_completed_successfully

  erp-ducklake-sink:
    <<: *hardening
    build:
      context: .
      target: ingest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DUCKLAKE_CATALOG: ducklake:/home/app/lake/catalog.ducklake
      DUCKLAKE_DATA_PATH: /home/app/lake/data/
      STOP_AFTER_IDLE_SECONDS: 15
    tmpfs:
      - /home/app/lake:uid=1000,gid=1000
    depends_on:
      erp-simulator:
        condition: service_completed_successfully

  train:
    <<: *hardening
    build:
      context: .
      target: train
    environment:
      ERP_POSTGRES_HOST: postgres
      ERP_POSTGRES_USER: livraison
      ERP_POSTGRES_PASSWORD: livraison
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      erp-postgres-sink:
        condition: service_completed_successfully

  api:
    <<: *hardening
    build:
      context: .
      target: api
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:uid=1000,gid=1000
    environment:
      API_KEY: test
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts:ro
    depends_on:
      train:
        condition: service_completed_successfully

volumes:
  artifacts:
  postgres_erp_data:
