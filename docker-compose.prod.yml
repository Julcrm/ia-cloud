# Environnement de production (VPS, Coolify) : code server Dagster du réentraînement et consumer
# du topic erp.orders vers DuckLake.
# L'API est une app Coolify « Docker Image » à part (ghcr.io/julcrm/ia-cloud-api:sha-<commit>),
# seul type où Coolify fait un rolling update (ADR-0005) ; elle reprend le HEALTHCHECK de l'image.
# PostgreSQL (base de l'ERP, catalogue DuckLake, stockage Dagster) et Garage sont des services partagés du VPS,
# joints par les variables d'environnement définies dans Coolify (ADR-0006, ADR-0007).
# Images testées par le pipeline, tag figé sha-<commit> (ADR-0005).

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# Garage : artefacts du modèle écrits par Dagster (ADR-0002) et fichiers DuckLake.
x-s3-env: &s3-env
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  MODEL_S3_BUCKET: ${MODEL_S3_BUCKET:?}

# Lac DuckLake (ADR-0001) : catalogue dans la base PostgreSQL ia_cloud, fichiers sur Garage.
# Écrit par le consumer ERP (table erp_orders), lu par l'entraînement.
x-ducklake-env: &ducklake-env
  DUCKLAKE_CATALOG: "ducklake:postgres:"
  DUCKLAKE_DATA_PATH: ${DUCKLAKE_DATA_PATH:?}
  POSTGRES_HOST: ${POSTGRES_HOST:?}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-ia_cloud}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

services:
  # Code server Dagster (réentraînement planifié) : le dagster-workspace du VPS le charge en gRPC
  # (workspace.yaml : host ia-cloud-dagster, port 4000) et réentraîne le modèle chaque nuit.
  ia-cloud-dagster:
    <<: *hardening
    image: ghcr.io/julcrm/ia-cloud-orchestrator:${IMAGE_TAG:?tag sha-<commit> obligatoire}
    restart: always
    expose:
      - "4000"
    environment:
      DAGSTER_POSTGRES_HOST: ${DAGSTER_POSTGRES_HOST:?}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:?}
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER:?}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?}
      <<: [*s3-env, *ducklake-env]
      ORDERS_SOURCE: ducklake # commandes de l'ERP copiées dans DuckLake (table erp_orders)
    # Socket simple : dagster api grpc-health-check chargerait Dagster à chaque test.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 4000), 3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - coolify

  # Consumer Redpanda : copie le topic erp.orders dans DuckLake (table erp_orders).
  erp-ducklake-sink:
    <<: *hardening
    image: ghcr.io/julcrm/ia-cloud-ingest:${IMAGE_TAG:?tag sha-<commit> obligatoire}
    restart: unless-stopped
    environment:
      <<: [*s3-env, *ducklake-env]
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - coolify

networks:
  coolify:
    external: true
    name: coolify
