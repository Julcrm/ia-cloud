# Pipeline : une pull request n'est fusionnée que si tout est au vert (CONTRIBUTING.md).
# Actions figées par SHA de commit, un tag peut être déplacé
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint, tests et contrat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.7.7" # même version que le Dockerfile
          enable-cache: true

      - name: Dépendances
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check --output-format github .

      - name: Formatage (ruff format)
        run: uv run ruff format --check --diff .

      - name: Tests (prédiction, API, conformité à openapi.yml)
        run: uv run pytest -v

  docker:
    name: Images Docker
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build de l'image API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          tags: ia-cloud-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build de l'image d'entraînement
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: train
          tags: ia-cloud-train:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build de l'image du code server Dagster
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: orchestrator
          tags: ia-cloud-orchestrator:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build de l'image du consumer ERP
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ingest
          tags: ia-cloud-ingest:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Le consumer ERP s'importe
        run: docker run --rm ia-cloud-ingest:ci python -c "import express_delivery.infrastructure.redpanda.erp_orders_consumer"

      - name: La code location Dagster se charge
        run: docker run --rm -e DAGSTER_HOME=/tmp ia-cloud-orchestrator:ci dagster definitions validate -m express_delivery.orchestration.definitions

      - name: L'entraînement se termine sans erreur
        run: docker run --rm ia-cloud-train:ci

      - name: L'API démarre, durcie comme en production
        run: |
          docker run -d --name api -p 8000:8000 -e API_KEY=ci \
            --read-only --tmpfs /tmp --tmpfs /app/data:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            ia-cloud-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs api
          [ "$status" = healthy ] || { echo "Healthcheck : $status"; exit 1; }
          curl -fsS http://localhost:8000/health/ready
          curl -fsS -H "X-API-Key: ci" http://localhost:8000/v1/model > /dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/model)" = 401 ]

      - name: Vulnérabilités de l'image API (critiques et élevées corrigibles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ia-cloud-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Publication sur GHCR après fusion seulement (jamais sur une pull request) :
  # dev → tag dev (test), main → tags main et latest (production), plus sha-<commit>.
  publish:
    name: Publication des images (GHCR)
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, train, orchestrator, ingest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ia-cloud-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build et push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Provenance et SBOM : d'où vient l'image et ce qu'elle contient.
          provenance: mode=max
          sbom: true

  # Déploiement prod automatique (ADR-0005) : fixe IMAGE_TAG sur le sha qu'on vient de
  # publier, puis déclenche le redeploy Coolify. L'API Coolify n'est joignable que par
  # l'IP Tailscale du VPS (non publique), d'où le nœud CI éphémère tag:ci.
  deploy:
    name: Déploiement Coolify
    needs: publish
    # Ignoré tant que les UUID Coolify ne sont pas définis : le pipeline reste vert avant config.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && vars.COOLIFY_APP_UUID != '' && vars.COOLIFY_API_UUID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # jeton OIDC pour rejoindre le tailnet, aucun secret Tailscale longue durée
    env:
      COOLIFY_API: http://100.125.33.49:8000/api/v1 # IP Tailscale du VPS
      UUID: ${{ vars.COOLIFY_APP_UUID }} # app compose : code server Dagster
      API_UUID: ${{ vars.COOLIFY_API_UUID }} # app Docker Image : API
    steps:
      - name: Rejoindre le tailnet (nœud éphémère tag:ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.125.33.49

      # API : app Coolify « Docker Image » à part, seul type où Coolify fait un rolling update
      # (attend /health/ready via le HEALTHCHECK de l'image avant de couper l'ancienne).
      - name: API - tag de l'image = sha publié, puis rolling update
        run: |
          TAG="sha-${GITHUB_SHA:0:7}" # même format que docker/metadata-action type=sha
          curl -fsS --max-time 30 -X PATCH "$COOLIFY_API/applications/$API_UUID" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\":\"$TAG\"}"
          curl -fsS --max-time 30 -X POST "$COOLIFY_API/deploy?uuid=$API_UUID&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      # Code server Dagster (compose) : recréé sans rolling, une coupure de quelques secondes
      # ne gêne que le réentraînement planifié.
      - name: Dagster - IMAGE_TAG = sha publié, puis redeploy
        run: |
          TAG="sha-${GITHUB_SHA:0:7}"
          curl -fsS --max-time 30 -X PATCH "$COOLIFY_API/applications/$UUID/envs" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"IMAGE_TAG\",\"value\":\"$TAG\"}"
          curl -fsS --max-time 30 -X POST "$COOLIFY_API/deploy?uuid=$UUID&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
